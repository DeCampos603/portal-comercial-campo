# Sincroniza a tabela de preços (Google Sheets → Supabase).
#
# INSTALAR: copie para .github/workflows/sync-precos.yml
#
# SEGREDOS necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_URL                https://<projeto>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   chave secret do Supabase
#   SHEETS_URL                  link de compartilhamento da planilha da Sigma
#                               (o script aceita o link inteiro ou só o ID)
#
# 🔴 A service_role key ignora RLS por completo. Ela vive AQUI e só aqui —
#    nunca no frontend, nunca commitada. Segredos do Actions não são
#    expostos em logs nem para pull requests de forks.
#
# 🔴 O link da planilha também é SEGREDO, não configuração. A planilha está
#    compartilhada como "qualquer pessoa com o link", e traz preço de custo,
#    saldo de estoque e a aba de COMISSÃO. Commitar a URL num repositório
#    público entregaria tudo isso a quem passasse por lá.
#
# Efeito colateral útil: a execução diária conta como atividade e impede
# o projeto Supabase gratuito de ser pausado por inatividade (1 semana).

name: Sincronizar preços

on:
  schedule:
    - cron: '0 11 * * *'      # 08:00 no horário de Brasília (UTC-3), todo dia
  workflow_dispatch:           # permite rodar na mão pelo painel do GitHub
    inputs:
      forcar:
        description: 'Ignorar as travas de sanidade'
        type: boolean
        default: false

# Duas execuções simultâneas gravando no catálogo seria péssimo.
concurrency:
  group: sync-precos
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # openpyxl é obrigatório: a planilha da Sigma é lida como XLSX, no
      # formato original (cabeçalho na linha 19, três abas, catálogo lateral).
      - name: Instalar dependências
        run: pip install --quiet requests openpyxl

      - name: Sincronizar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHEETS_URL: ${{ secrets.SHEETS_URL }}
          SHEETS_CSV_URL: ${{ secrets.SHEETS_CSV_URL }}   # alternativa, se um dia houver aba limpa
        run: |
          python ferramentas/sincronizar_supabase.py \
            ${{ inputs.forcar && '--forcar' || '' }}

      # Se as travas de sanidade bloquearem, o passo acima falha e o GitHub
      # manda e-mail. O catálogo anterior continua no ar — que é o certo:
      # melhor preço velho do que preço errado.
      # A orientação anterior mandava rodar com 'forcar' em qualquer falha.
      # Isso só faz sentido quando a TRAVA DE SANIDADE bloqueou. Se o que
      # faltou foi um segredo, 'forcar' falha de novo do mesmo jeito — e a
      # pessoa perde a viagem antes de ler o log.
      - name: Explicar a falha
        if: failure()
        run: |
          echo "::error::Sincronização não concluída. O catálogo ANTERIOR continua no ar."
          echo ""
          echo "Leia a mensagem do passo 'Sincronizar' acima. Ela diz qual é o caso:"
          echo ""
          echo "  • 'Faltando: <NOME>'  → configuração. Cadastre o segredo em"
          echo "    Settings → Secrets and variables → Actions. Rodar com 'forcar'"
          echo "    NÃO resolve."
          echo ""
          echo "  • 'SINCRONIZAÇÃO BLOQUEADA' → os números da planilha variaram"
          echo "    além do limite. Confira a planilha. Se estiverem certos mesmo,"
          echo "    rode este workflow na mão marcando 'forcar'."
          echo ""
          echo "  • 'página HTML, não a planilha' → permissão. A planilha precisa"
          echo "    estar como 'Qualquer pessoa com o link' → Leitor."
